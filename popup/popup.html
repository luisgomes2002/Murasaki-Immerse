<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murasaki Immerse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Cabeçalho -->
    <header class="header">
      <svg class="logo-icon" viewBox="0 0 32 32" width="28" height="28">
        <circle cx="16" cy="16" r="14" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
        <polyline points="10,16 14,20 22,12" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="header-text">
        <h1 class="title">Murasaki <span class="accent">Immerse</span></h1>
        <span class="subtitle">Language immersion tracker</span>
      </div>
      <span class="streak-badge" id="streak-badge"><span id="streak-value">0</span></span>
    </header>

    <!-- Stats: today / week / month -->
    <section class="stats-row">
      <div class="stat-card today-card">
        <div class="stat-body">
          <span class="stat-value" id="today-value">0m</span>
          <span class="stat-label">today</span>
        </div>
      </div>
      <div class="stat-card week-card">
        <div class="stat-body">
          <span class="stat-value" id="week-value">0m</span>
          <span class="stat-label">this week</span>
        </div>
      </div>
      <div class="stat-card month-card">
        <div class="stat-body">
          <span class="stat-value" id="month-value">0m</span>
          <span class="stat-label">this month</span>
        </div>
      </div>
    </section>

    <!-- Language breakdown -->
    <section class="section" id="languages-section">
      <h2 class="section-title">Today's Languages</h2>
      <div id="languages-list" class="languages-list">
        <div class="empty-hint">No immersion data yet. Start watching!</div>
      </div>
    </section>

    <!-- Weekly chart -->
    <section class="section" id="week-section">
      <h2 class="section-title">Last 7 Days</h2>
      <div id="week-chart" class="week-chart">
        <div class="empty-hint">Loading...</div>
      </div>
    </section>

    <!-- Region Switch (collapsível) -->
    <section class="section region-section">
      <button id="region-toggle" class="region-toggle">
        <span>Region Switch</span>
        <svg id="region-chevron" viewBox="0 0 12 8" width="12" height="8" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1,1 6,6 11,1"/>
        </svg>
      </button>
      <div id="region-body" class="region-body hidden">
        <div id="region-inactive" class="region-inactive">
          <div class="region-controls">
            <select id="region-country" class="filter-select region-select">
              <!-- Populado via JS -->
            </select>
            <button id="region-switch-btn" class="region-switch-btn">Switch</button>
          </div>
        </div>
        <div id="region-active" class="region-active hidden">
          <span class="region-status">YouTube is set to <strong id="region-current">—</strong></span>
          <button id="region-restore-btn" class="region-restore-btn">Restore default</button>
        </div>
      </div>
    </section>

    <!-- Rodapé -->
    <footer class="footer">
      <span id="last-update" class="last-update"></span>
      <button id="refresh-btn" class="refresh-btn" title="Refresh">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
